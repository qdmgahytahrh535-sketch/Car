<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبیه‌ساز مسابقه ماشین (نمای ماهواره‌ای)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a2e1a;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 22px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
        }

        #container {
            position: relative;
            width: 600px;
            height: 450px;
            background: radial-gradient(circle, #2e5a2e 0%, #132213 100%);
            border: 4px solid #444;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .track {
            position: absolute;
            top: 75px;
            left: 75px;
            width: 450px;
            height: 300px;
            border: 55px solid #333;
            border-radius: 225px / 150px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .start-line {
            position: absolute;
            top: 75px;
            left: 300px;
            width: 55px;
            height: 6px;
            background: repeating-linear-gradient(90deg, #fff, #fff 6px, #000 6px, #000 12px);
            z-index: 2;
        }

        #car {
            position: absolute;
            width: 26px;
            height: 14px;
            background: #e74c3c;
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(0,0,0,0.7);
            z-index: 5;
            transform-origin: center center;
        }

        #car::after {
            content: '';
            position: absolute;
            right: 2px;
            top: 3px;
            width: 4px;
            height: 8px;
            background: #f1c40f;
            border-radius: 2px;
        }

        .controls {
            margin-top: 20px;
            text-align: center;
        }

        #startBtn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }

        #startBtn:hover {
            background-color: #219653;
        }

        #startBtn:active {
            transform: scale(0.97);
        }

        #startBtn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }

        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #d1d1d1;
        }
    </style>
</head>
<body>

    <h1>پیست مسابقه (نمای ماهواره‌ای)</h1>

    <div id="container">
        <div class="track"></div>
        <div class="start-line"></div>
        <div id="car"></div>
    </div>

    <div class="controls">
        <button id="startBtn">شروع مسابقه</button>
        <div id="status">وضعیت: آماده برای شروع</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
